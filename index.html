<!DOCTYPE html><html lang=en><head><meta charset=UTF-8><meta name=viewport content="width=device-width,initial-scale=1"><title>SyncParty - Watch Together</title><script src=https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js></script><script src=https://cdn.jsdelivr.net/npm/webtorrent@latest/webtorrent.min.js></script><link rel=stylesheet href=style.css><link rel=preconnect href=https://fonts.googleapis.com><link rel=preconnect href=https://fonts.gstatic.com crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel=stylesheet></head><body><div id=login-modal class=modal-overlay><div class=modal-content><h2>Welcome to MovieParty</h2><div class=input-group><label>Choose your Username</label> <input type=text id=username-input placeholder="e.g. MovieBuff99" maxlength=12></div><button id=btn-start-app class="btn primary full-width">Enter Room</button></div></div><div class="app-container blur-bg" id=app-root><header class=top-bar><div class=logo>MovieParty <span id=room-badge class="badge hidden">Room</span></div><div class=connection-controls><div id=setup-panel><button id=btn-create-room class="btn primary">Start New Room</button></div><div id=room-panel class=hidden><div class=url-copy-box id=btn-copy-url title="Click to Copy ID/URL"><span class=icon>🔗</span> <span class=text>Invite Friends</span></div></div></div></header><main class=main-content><div class=video-section><div class=video-container><video id=main-video controls playsinline></video><div id=file-warning class="warning-overlay hidden">⚠️ File Mismatch: Your file size differs from Host.</div><div class=placeholder-overlay id=video-placeholder><h3>No Video Loaded</h3><p>Select a video file to start watching.</p><div class=file-actions><input type=file id=file-input accept=video/*,.mkv class=hidden> <button id=btn-select-file class="btn secondary">Select Local Video</button> <button id=btn-magnet-ui class="btn secondary">Add Magnet Link</button></div></div></div><div class=controls-bar><div class=left-controls><span id=file-name-display>No File Selected</span> <span id=file-match-status class="status-dot grey" title=Status></span></div><div class=right-controls><input type=file id=sub-input accept=.srt,.vtt class=hidden> <button id=btn-add-sub class="btn icon" title="Upload Subtitles">💬 Add Subs</button><div class=dropdown><button id=btn-subs-menu class="btn icon">CC</button><div class=dropdown-content id=subs-list><div class=dropdown-header>Subtitles</div><div class="dropdown-item active" data-val=off>Off</div></div></div><div class=dropdown><button id=btn-audio-menu class="btn icon">🔊</button><div class=dropdown-content id=audio-list><div class=dropdown-header>Audio Tracks</div><div class=dropdown-item data-val=default>Default</div></div></div></div></div></div><aside class=sidebar><div class=tabs><button class="tab-btn active" data-tab=chat>Chat</button> <button class=tab-btn data-tab=users>Users <span id=user-count-badge class=badge-mini>0</span></button></div><div class="tab-content active" id=tab-chat><div id=chat-messages class=chat-messages><div class="message system">Welcome! Share the URL to invite friends.</div></div><div class=chat-input-area><input type=text id=chat-input placeholder="Type a message..."> <button id=btn-send-chat class="btn icon">➤</button></div></div><div class=tab-content id=tab-users><ul id=user-list class=user-list></ul></div></aside></main></div><div id=magnet-modal class="modal-overlay hidden"><div class=modal-content><h3>Load Torrent</h3><input type=text id=magnet-input placeholder="magnet:?xt=urn:btih:..."><div class=modal-actions><button id=btn-load-magnet class="btn primary">Load</button> <button id=btn-cancel-magnet class="btn text">Cancel</button></div></div></div><script src=sync.js></script><script src=app.js></script></body></html>
