<!DOCTYPE html><html lang=en><head><meta charset=UTF-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Sync Watch Party</title><script src=https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js></script><script src=https://cdn.jsdelivr.net/npm/webtorrent@latest/webtorrent.min.js></script><link rel=stylesheet href=style.css><link rel=preconnect href=https://fonts.googleapis.com><link rel=preconnect href=https://fonts.gstatic.com crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel=stylesheet></head><body><div class=app-container><header class=top-bar><div class=logo>SyncPartyy</div><div class=connection-controls><div id=setup-panel><button id=btn-create-room class="btn primary">Create Room</button> <span class=divider>or</span> <input type=text id=join-id-input placeholder="Enter Host ID to Join"> <button id=btn-join-room class="btn secondary">Join</button></div><div id=status-panel class=hidden><span id=role-indicator class=badge>Wait...</span><div id=host-controls class=hidden><span class=label>My ID:</span> <span id=my-peer-id class=code-box title="Click to Copy">...</span> <input type=file id=file-input accept=video/* class=hidden> <button id=btn-select-file class="btn small">Select File</button> <button id=btn-add-magnet class="btn small">Add Magnet</button></div></div></div></header><main class=main-content><div class=video-container><video id=main-video controls playsinline><div class=placeholder-overlay><h3>No Video Selected</h3><p>Host needs to select a file or add a magnet link.</p></div></video><div id=magnet-overlay class="overlay hidden"><div class=overlay-content><h3>Enter Magnet Link</h3><input type=text id=magnet-input placeholder="magnet:?xt=urn:btih:..."><div class=overlay-actions><button id=btn-load-magnet class="btn primary">Load</button> <button id=btn-cancel-magnet class="btn text">Cancel</button></div></div></div></div><aside class=chat-container><div class=chat-header><h3>Chat</h3><span id=users-count class=badge-small>1 User</span></div><div id=chat-messages class=chat-messages><div class="message system">Welcome to SyncPartyy!</div></div><div class=chat-input-area><input type=text id=chat-input placeholder="Type a message..."> <button id=btn-send-chat class="btn icon">➤</button></div></aside></main></div><script src=sync.js></script><script src=app.js></script></body></html>
